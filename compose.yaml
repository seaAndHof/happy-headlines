# HappyHeadlines
# Start everything:  docker compose up --build
name: happyheadlines

x-postgres-health: &postgres-health
  # TCP check: during first-time setup Postgres only listens on a local socket, so this waits for the seed data.
  test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U happy"]
  interval: 2s
  retries: 30

# The ArticleDatabase of one continent (z-axis split); CONTINENT names it.
x-continent-db: &continent-db
  image: postgres:17-alpine
  volumes:
    - ./db/continent-db.sh:/docker-entrypoint-initdb.d/continent-db.sh:ro
  healthcheck: *postgres-health

x-continent-db-env: &continent-db-env
  POSTGRES_USER: happy
  POSTGRES_PASSWORD: headlines
  POSTGRES_DB: articles

x-redis-health: &redis-health
  test: ["CMD", "redis-cli", "ping"]
  interval: 2s
  retries: 30

services:
  # --- Articles ---------------------------------------------------------------------------------

  article-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: happy
      POSTGRES_PASSWORD: headlines
      POSTGRES_DB: articles
    volumes:
      - ./db/article-db.sql:/docker-entrypoint-initdb.d/article-db.sql:ro
    healthcheck: *postgres-health
    labels:
      happyheadlines.c4: ArticleDatabase (global)
      happyheadlines.description: "PostgreSQL: the global article database, in North America"

  article-db-africa:
    <<: *continent-db
    environment: { <<: *continent-db-env, CONTINENT: africa }
    labels: { happyheadlines.c4: ArticleDatabase (africa), happyheadlines.description: "PostgreSQL: articles for Africa" }

  article-db-antarctica:
    <<: *continent-db
    environment: { <<: *continent-db-env, CONTINENT: antarctica }
    labels: { happyheadlines.c4: ArticleDatabase (antarctica), happyheadlines.description: "PostgreSQL: articles for Antarctica" }

  article-db-asia:
    <<: *continent-db
    environment: { <<: *continent-db-env, CONTINENT: asia }
    labels: { happyheadlines.c4: ArticleDatabase (asia), happyheadlines.description: "PostgreSQL: articles for Asia" }

  article-db-europe:
    <<: *continent-db
    environment: { <<: *continent-db-env, CONTINENT: europe }
    labels: { happyheadlines.c4: ArticleDatabase (europe), happyheadlines.description: "PostgreSQL: articles for Europe" }

  article-db-north-america:
    <<: *continent-db
    environment: { <<: *continent-db-env, CONTINENT: north-america }
    labels: { happyheadlines.c4: ArticleDatabase (north-america), happyheadlines.description: "PostgreSQL: articles for North America" }

  article-db-oceania:
    <<: *continent-db
    environment: { <<: *continent-db-env, CONTINENT: oceania }
    labels: { happyheadlines.c4: ArticleDatabase (oceania), happyheadlines.description: "PostgreSQL: articles for Oceania" }

  article-db-south-america:
    <<: *continent-db
    environment: { <<: *continent-db-env, CONTINENT: south-america }
    labels: { happyheadlines.c4: ArticleDatabase (south-america), happyheadlines.description: "PostgreSQL: articles for South America" }

  article-cache:
    image: redis:8-alpine
    healthcheck: *redis-health
    labels:
      happyheadlines.c4: ArticleCache
      happyheadlines.description: "Redis: articles from the last 14 days, filled by article-cache-warmer"

  article-service:
    build: { context: ., args: { SERVICE: ArticleService } }
    image: happyheadlines/article-service
    deploy:
      replicas: 3 # x-axis split: three identical clones behind article-lb
    environment:
      ArticleCache: article-cache:6379 # the eight ArticleDatabases are in src/ArticleService/appsettings.json
    depends_on:
      transatlantic-link-setup: { condition: service_completed_successfully }
      article-cache: { condition: service_healthy }
      article-db-africa: { condition: service_healthy }
      article-db-antarctica: { condition: service_healthy }
      article-db-asia: { condition: service_healthy }
      article-db-europe: { condition: service_healthy }
      article-db-north-america: { condition: service_healthy }
      article-db-oceania: { condition: service_healthy }
      article-db-south-america: { condition: service_healthy }
    labels:
      happyheadlines.c4: ArticleService
      happyheadlines.description: ".NET REST API: article CRUD per continent; global reads go through the ArticleCache (3 replicas)"

  article-lb:
    image: nginx:alpine
    ports:
      - "8081:80" # http://localhost:8081/articles/global/1
    volumes:
      - ./network/article-lb.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - article-service
    labels:
      happyheadlines.c4: ArticleService (load balancer)
      happyheadlines.description: "nginx: spreads requests round robin over the ArticleService replicas"

  article-cache-warmer:
    build: { context: ., args: { SERVICE: ArticleCacheWarmer } }
    image: happyheadlines/article-cache-warmer
    environment:
      ArticleDatabase: Host=transatlantic-link;Port=5432;Database=articles;Username=happy;Password=headlines;GSS Encryption Mode=Disable
      ArticleCache: article-cache:6379
      RefreshInterval: "00:01:00"
    depends_on:
      transatlantic-link-setup: { condition: service_completed_successfully }
      article-cache: { condition: service_healthy }
    labels:
      happyheadlines.c4: ArticleCache (offline process)
      happyheadlines.description: ".NET: copies the last 14 days of articles into the ArticleCache every minute"

  # --- Comments ---------------------------------------------------------------------------------

  comment-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: happy
      POSTGRES_PASSWORD: headlines
      POSTGRES_DB: comments
    volumes:
      - ./db/comment-db.sql:/docker-entrypoint-initdb.d/comment-db.sql:ro
    healthcheck: *postgres-health
    labels:
      happyheadlines.c4: CommentDatabase
      happyheadlines.description: "PostgreSQL: all comments, in North America"

  comment-cache:
    image: redis:8-alpine
    healthcheck: *redis-health
    labels:
      happyheadlines.c4: CommentCache
      happyheadlines.description: "Redis: comments of the 30 most recently read articles, filled on a cache miss"

  comment-service:
    build: { context: ., args: { SERVICE: CommentService } }
    image: happyheadlines/comment-service
    deploy:
      replicas: 2
    environment:
      CommentDatabase: Host=transatlantic-link;Port=5433;Database=comments;Username=happy;Password=headlines;GSS Encryption Mode=Disable
      CommentCache: comment-cache:6379
      CommentCacheMaxArticles: "30"
      ProfanityService: http://profanity-service:8080
    depends_on:
      transatlantic-link-setup: { condition: service_completed_successfully }
      comment-cache: { condition: service_healthy }
      profanity-service: { condition: service_started }
    labels:
      happyheadlines.c4: CommentService
      happyheadlines.description: ".NET REST API: comments from the CommentCache or database; new comments pass the ProfanityService (2 replicas)"

  # --- Profanity (its own swimlane) -------------------------------------------------------------

  profanity-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: happy
      POSTGRES_PASSWORD: headlines
      POSTGRES_DB: profanity
    volumes:
      - ./db/profanity-db.sql:/docker-entrypoint-initdb.d/profanity-db.sql:ro
    healthcheck: *postgres-health
    labels:
      happyheadlines.c4: ProfanityDatabase
      happyheadlines.description: "PostgreSQL: the words the ProfanityService masks"

  profanity-service:
    build: { context: ., args: { SERVICE: ProfanityService } }
    image: happyheadlines/profanity-service
    environment:
      ProfanityDatabase: Host=profanity-db;Database=profanity;Username=happy;Password=headlines;GSS Encryption Mode=Disable
    depends_on:
      profanity-db: { condition: service_healthy }
    labels:
      happyheadlines.c4: ProfanityService
      happyheadlines.description: ".NET REST API: masks profanity in a text"

  # --- Europe <-> North America -----------------------------------------------------------------

  transatlantic-link:
    image: ghcr.io/shopify/toxiproxy:2.12.0
    ports:
      - "8474:8474" # Toxiproxy API: change the latency or cut the link during the demo (see README)
    labels:
      happyheadlines.c4: Network (simulated)
      happyheadlines.description: "Toxiproxy: the services in Europe reach the databases in North America through it, +100 ms"

  transatlantic-link-setup:
    image: curlimages/curl:latest
    entrypoint: ["sh", "/transatlantic-link.sh"]
    volumes:
      - ./network/transatlantic-link.sh:/transatlantic-link.sh:ro
    depends_on:
      transatlantic-link: { condition: service_started }
      article-db: { condition: service_healthy }
      comment-db: { condition: service_healthy }
    labels:
      happyheadlines.c4: Network (simulated)
      happyheadlines.description: "One-shot: creates the article-db and comment-db links with 100 ms latency, then exits"

  transatlantic-control:
    image: nginx:alpine
    ports:
      - "8475:80" # control panel: http://localhost:8475
    volumes:
      - ./network/control/index.html:/usr/share/nginx/html/index.html:ro
      - ./network/control/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - transatlantic-link
      - prometheus
      - grafana
    labels:
      happyheadlines.c4: Network (simulated)
      happyheadlines.description: "Control panel: change the transatlantic link's latency or cut it, and watch hit and miss times"

  # --- Traffic ---------------------------------------------------------------------------------

  reader-simulator:
    build: { context: ., args: { SERVICE: ReaderSimulator } }
    image: happyheadlines/reader-simulator
    environment:
      ArticleService: http://article-lb
      CommentService: http://comment-service:8080
      Readers: "5"
    depends_on:
      article-lb: { condition: service_started }
      comment-service: { condition: service_started }
    labels:
      happyheadlines.c4: Website (simulated)
      happyheadlines.description: ".NET: simulated readers requesting articles and comments, and posting comments"

  # --- Monitoring -------------------------------------------------------------------------------

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9091:9090" # http://localhost:9091
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    labels:
      happyheadlines.c4: Monitoring
      happyheadlines.description: "Prometheus: scrapes the cache metrics from every service replica"

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3030:3000" # dashboard: http://localhost:3030
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/caching.json
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    labels:
      happyheadlines.c4: Monitoring
      happyheadlines.description: "Grafana: the cache hit ratio dashboard"

  database-viewer:
    image: dbgate/dbgate:7.3.1-alpine
    ports:
      - "8085:3000" # http://localhost:8085
    environment:
      USAGE_ANALYTICS: "false"
      CONNECTIONS: articledb,articlecache,commentdb,commentcache
      LABEL_articledb: ArticleDatabase
      ENGINE_articledb: postgres@dbgate-plugin-postgres
      SERVER_articledb: article-db
      PORT_articledb: "5432"
      USER_articledb: happy
      PASSWORD_articledb: headlines
      DATABASE_articledb: articles
      READONLY_articledb: "true"
      LABEL_articlecache: ArticleCache
      ENGINE_articlecache: redis@dbgate-plugin-redis
      SERVER_articlecache: article-cache
      PORT_articlecache: "6379"
      DATABASE_articlecache: db0
      READONLY_articlecache: "true"
      LABEL_commentdb: CommentDatabase
      ENGINE_commentdb: postgres@dbgate-plugin-postgres
      SERVER_commentdb: comment-db
      PORT_commentdb: "5432"
      USER_commentdb: happy
      PASSWORD_commentdb: headlines
      DATABASE_commentdb: comments
      READONLY_commentdb: "true"
      LABEL_commentcache: CommentCache
      ENGINE_commentcache: redis@dbgate-plugin-redis
      SERVER_commentcache: comment-cache
      PORT_commentcache: "6379"
      DATABASE_commentcache: db0
      READONLY_commentcache: "true"
    depends_on:
      - article-db
      - comment-db
      - article-cache
      - comment-cache
    labels:
      happyheadlines.c4: Monitoring
      happyheadlines.description: "DbGate: browse the two databases and the two caches in the browser (read-only)"
