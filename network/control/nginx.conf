server {
    listen 80;
    root /usr/share/nginx/html;

    location /toxiproxy/ {
        proxy_pass http://transatlantic-link:8474/;
        proxy_set_header User-Agent "transatlantic-control";
    }

    location /prometheus/ {
        proxy_pass http://prometheus:9090/;
    }

    location /grafana/ {
        proxy_pass http://grafana:3000/;
        proxy_set_header Origin "";
    }
}
