# The load balancer for the x-axis split: three identical, stateless ArticleService clones behind one address.
resolver 127.0.0.11 valid=5s ipv6=off; # Docker's embedded DNS

upstream article_service_clones {
    # Docker's DNS answers "article-service" with one address per replica, and nginx keeps one server per address
    # (re-resolved every 5 s, so scaling up or down is picked up). Requests go round robin. A replica that fails
    # 3 times within 10 s is left out for 10 s.
    zone article_service_clones 64k;
    server article-service:8080 resolve max_fails=3 fail_timeout=10s;
}

server {
    listen 80;

    location / {
        proxy_pass http://article_service_clones;
        proxy_connect_timeout 1s;
        proxy_next_upstream error timeout; # a replica that is down: try the next one (never for POST)
        add_header X-Upstream $upstream_addr always; # which replica answered
    }
}
