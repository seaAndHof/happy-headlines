global:
  scrape_interval: 5s

scrape_configs:
  # Docker's DNS returns one address per replica, so every replica is scraped.
  - job_name: article-service
    dns_sd_configs:
      - names: [article-service]
        type: A
        port: 8080
  - job_name: comment-service
    dns_sd_configs:
      - names: [comment-service]
        type: A
        port: 8080
